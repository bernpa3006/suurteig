<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sourdough Calculator</title>
<style>
  :root{
    --bg:      #0b0713;
    --surface: #17102b;
    --surface2:#1f1638;
    --line:    #382a5c;
    --text:    #f5f0ff;
    --text-dim:#a99bd4;

    --copain-a:  #ff2ec4;
    --copain-b:  #ff8a1e;
    --focaccia-a:#00f5a0;
    --focaccia-b:#00c2ff;
    --pizza-a:   #ff3d5a;
    --pizza-b:   #ff9d00;
    --custom-a:  #7b2ff7;
    --custom-b:  #00e5ff;
    --cuchaule-a:#ffd23f;
    --cuchaule-b:#f2a900;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  .num, [class*="pct"], .ing-amt, .t-value, .hero-unit, .flour-total-val,
  .chip b, .step-title span:last-child, .portion-chip{
    font-family: 'Space Grotesk', sans-serif;
  }
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(255,46,196,0.16), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(0,229,255,0.14), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(123,47,247,0.18), transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: 'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.45;
    padding: 20px 14px 70px;
    min-height: 100vh;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }

  header.top{ margin-bottom: 20px; }
  header.top h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.7rem;
    margin: 0 0 2px;
    font-weight: 700;
    letter-spacing: -0.01em;
    background: linear-gradient(90deg, #ff2ec4, #7b2ff7, #00e5ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header.top p{
    margin: 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex;
    gap: 4px;
    background: var(--surface);
    padding: 5px;
    border-radius: 16px;
    margin-bottom: 20px;
    border: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex: 1 1 0;
    min-width: max-content;
    background:none;
    border:none;
    font-family:inherit;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 10px 10px;
    border-radius: 12px;
    color: var(--text-dim);
    cursor:pointer;
    transition: background .18s ease, color .18s ease, transform .1s ease;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .tab-icon{ width:15px; height:15px; display:inline-flex; flex:0 0 auto; }
  .tab-icon svg{ width:100%; height:100%; display:block; }
  nav.tabs button:active{ transform: scale(0.96); }
  nav.tabs button.active[data-tab="copain"]{ background: linear-gradient(120deg, var(--copain-a), var(--copain-b)); color:#1a0510; }
  nav.tabs button.active[data-tab="focaccia"]{ background: linear-gradient(120deg, var(--focaccia-a), var(--focaccia-b)); color:#04231a; }
  nav.tabs button.active[data-tab="pizza"]{ background: linear-gradient(120deg, var(--pizza-a), var(--pizza-b)); color:#2b0503; }
  nav.tabs button.active[data-tab="custom"]{ background: linear-gradient(120deg, var(--custom-a), var(--custom-b)); color:#0a0518; }
  nav.tabs button.active[data-tab="cuchaule"]{ background: linear-gradient(120deg, var(--cuchaule-a), var(--cuchaule-b)); color:#2b1200; }

  .panel{ display:none; animation: fade .25s ease; }
  .panel.active{ display:block; }
  @keyframes fade{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform:none; } }

  /* ---------- Hero number ---------- */
  .hero{
    border-radius: 24px;
    padding: 22px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px -10px var(--glow, rgba(255,46,196,0.5));
  }
  .hero .hero-label{
    font-size: 0.8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.8;
    margin-bottom: 4px;
  }
  .hero .hero-input-row{
    display:flex;
    align-items: baseline;
    gap: 8px;
  }
  .hero input[type=number]{
    background: none;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 3rem;
    font-weight: 700;
    width: 5.5ch;
    color: inherit;
    letter-spacing: -0.03em;
  }
  .hero input[type=number]:focus{ outline: none; }
  .hero .hero-unit{ font-size: 1.3rem; font-weight: 700; opacity: 0.8; }
  .hero .hero-sub{ margin-top: 8px; font-size: 0.8rem; opacity: 0.75; }

  .hero-copain{ background: linear-gradient(135deg, var(--copain-a), var(--copain-b)); color: #1a0510; --glow: rgba(255,46,196,0.45); }
  .hero-focaccia{ background: linear-gradient(135deg, var(--focaccia-a), var(--focaccia-b)); color: #04231a; --glow: rgba(0,245,160,0.4); }
  .hero-pizza{ background: linear-gradient(135deg, var(--pizza-a), var(--pizza-b)); color: #2b0503; --glow: rgba(255,61,90,0.45); }
  .hero-custom{ background: linear-gradient(135deg, var(--custom-a), var(--custom-b)); color: #f5f0ff; --glow: rgba(123,47,247,0.5); }
  .hero-cuchaule{ background: linear-gradient(135deg, var(--cuchaule-a), var(--cuchaule-b)); color: #2b1200; --glow: rgba(255,210,63,0.5); }

  .hero-emoji{
    position:absolute;
    right: -10px;
    bottom: -14px;
    width: 130px;
    height: 130px;
    opacity: 0.22;
    transform: rotate(-8deg);
  }
  .hero-emoji svg{ width:100%; height:100%; display:block; }

  .portion-row{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0 16px;
  }
  .portion-chip{
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 800;
    border: none;
    border-radius: 12px;
    padding: 9px 14px;
    background: rgba(0,0,0,0.2);
    color: inherit;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .portion-chip:active{ transform: scale(0.95); }
  .portion-chip.active{ background: rgba(0,0,0,0.4); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4); }

  /* ---------- Cards ---------- */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .card h2{
    font-size: 1rem;
    margin: 0 0 4px;
    font-weight: 800;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .card h2 .icon{ width:20px; height:20px; display:inline-flex; flex:0 0 auto; }
  .card h2 .icon svg{ width:100%; height:100%; display:block; }
  .inline-icon{ width:16px; height:16px; display:inline-flex; vertical-align:-3px; margin-right:6px; flex:0 0 auto; }
  .inline-icon svg{ width:100%; height:100%; display:block; }
  .card .sub{
    font-size: 0.8rem;
    color: var(--text-dim);
    margin: 0 0 14px;
  }

  /* ---------- Flour sliders ---------- */
  .flour-row{ margin-bottom: 14px; }
  .flour-row:last-child{ margin-bottom: 0; }
  .flour-row .flour-head{
    display:flex;
    justify-content: space-between;
    align-items:baseline;
    margin-bottom: 6px;
  }
  .flour-row .flour-head .name{ font-size: 0.92rem; font-weight: 600; }
  .flour-row .flour-head .pct{
    font-size: 0.95rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  input[type=range]{
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 8px;
    background: var(--line);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--track-color, #fff);
    border: 3px solid var(--bg);
    box-shadow: 0 0 12px var(--track-color, #fff);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb{
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--track-color, #fff);
    border: 3px solid var(--bg);
    cursor: pointer;
  }

  .accent-copain input[type=range]{ --track-color: var(--copain-a); }
  .accent-focaccia input[type=range]{ --track-color: var(--focaccia-a); }
  .accent-pizza input[type=range]{ --track-color: var(--pizza-a); }
  .accent-custom input[type=range]{ --track-color: var(--custom-b); }
  .accent-cuchaule input[type=range]{ --track-color: var(--cuchaule-a); }

  .flour-total{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display:flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-dim);
    font-weight: 700;
  }
  .flour-total .flour-total-val{ color: var(--text); }
  .flour-total.warn .flour-total-val{ color: var(--pizza-a); }

  /* ---------- Hydration ---------- */
  .hydration-value-row{
    display:flex;
    justify-content:center;
    margin: 4px 0 14px;
  }
  .hydration-big{ font-size: 2.4rem; font-weight: 700; line-height:1; }
  .accent-copain .hydration-num{ color: var(--copain-a); }
  .accent-focaccia .hydration-num{ color: var(--focaccia-a); }
  .accent-pizza .hydration-num{ color: var(--pizza-a); }
  .accent-custom .hydration-num{ color: var(--custom-b); }
  .accent-cuchaule .hydration-num{ color: var(--cuchaule-a); }
  .hydration-scale{
    display:flex;
    justify-content:space-between;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .hydration-presets{ margin-top: 16px; margin-bottom: 0; }
  .hydration-chip{
    background: var(--surface2);
    color: var(--text-dim);
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 2px;
    line-height: 1.2;
  }
  .hydration-chip .chip-sub{ font-size: 0.7rem; opacity: 0.7; font-weight: 600; }
  .hydration-chip.is-basic{ box-shadow: inset 0 0 0 1.5px var(--line); }
  .accent-copain .hydration-chip.active{ background: linear-gradient(120deg, var(--copain-a), var(--copain-b)); color:#1a0510; }
  .accent-focaccia .hydration-chip.active{ background: linear-gradient(120deg, var(--focaccia-a), var(--focaccia-b)); color:#04231a; }
  .accent-pizza .hydration-chip.active{ background: linear-gradient(120deg, var(--pizza-a), var(--pizza-b)); color:#2b0503; }
  .accent-custom .hydration-chip.active{ background: linear-gradient(120deg, var(--custom-a), var(--custom-b)); color:#f5f0ff; }
  .accent-cuchaule .hydration-chip.active{ background: linear-gradient(120deg, var(--cuchaule-a), var(--cuchaule-b)); color:#2b1200; }

  /* ---------- Steps (Backanleitung) ---------- */
  .step-list{ display:flex; flex-direction:column; gap: 10px; }
  .step-item{
    display:flex;
    align-items:flex-start;
    gap: 10px;
  }
  .step-num{
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-size: 0.72rem;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    background: var(--surface2);
  }
  .accent-copain .step-num{ background: linear-gradient(120deg, var(--copain-a), var(--copain-b)); color:#1a0510; }
  .accent-focaccia .step-num{ background: linear-gradient(120deg, var(--focaccia-a), var(--focaccia-b)); color:#04231a; }
  .accent-pizza .step-num{ background: linear-gradient(120deg, var(--pizza-a), var(--pizza-b)); color:#2b0503; }
  .accent-custom .step-num{ background: linear-gradient(120deg, var(--custom-a), var(--custom-b)); color:#f5f0ff; }
  .accent-cuchaule .step-num{ background: linear-gradient(120deg, var(--cuchaule-a), var(--cuchaule-b)); color:#2b1200; }
  .step-text{ font-size: 0.88rem; padding-top: 2px; }

  /* ---------- Aufklappbares Rezept ---------- */
  .recipe-details{ padding: 0; overflow: hidden; }
  .recipe-details summary{
    list-style: none;
    cursor: pointer;
    padding: 18px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .recipe-details summary::-webkit-details-marker{ display:none; }
  .recipe-details summary .icon{ margin:0; }
  .recipe-details summary .summary-text{
    flex: 1;
    font-size: 1rem;
    font-weight: 800;
  }
  .recipe-details summary .chevron{
    width: 18px; height: 18px;
    color: var(--text-dim);
    transition: transform .2s ease;
    flex: 0 0 auto;
  }
  .recipe-details summary .chevron svg{ width:100%; height:100%; display:block; }
  .recipe-details[open] summary .chevron{ transform: rotate(180deg); }
  .recipe-details .phase-list{
    padding: 0 18px 18px;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }
  .phase-title{
    font-size: 0.78rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .add-flour-btn{
    margin-top: 12px;
    width: 100%;
    background: var(--surface2);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 10px;
    color: var(--text-dim);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }

  /* ---------- Ingredient list ---------- */
  .ing-list{ display:flex; flex-direction:column; gap: 2px; }
  .ing-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .ing-row:last-child{ border-bottom:none; }
  .ing-row .ing-name{ font-size: 0.94rem; }
  .ing-row .ing-pct{ font-size: 0.78rem; color: var(--text-dim); margin-left: 6px; }
  .ing-row .ing-amt{
    font-size: 1.05rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .ing-row.sub{ padding-left: 14px; }
  .ing-row.sub .ing-name{ color: var(--text-dim); font-size: 0.86rem; }
  .ing-row.sub .ing-amt{ font-size: 0.92rem; font-weight: 700; color: var(--text-dim); }
  .ing-row.total{
    margin-top: 6px;
    padding-top: 14px;
    border-top: 2px solid var(--line);
    border-bottom: none;
  }
  .ing-row.total .ing-name{ font-weight: 800; }
  .ing-row.total .ing-amt{ font-size: 1.3rem; }

  .accent-copain .ing-row.total .ing-amt{ color: var(--copain-a); }
  .accent-focaccia .ing-row.total .ing-amt{ color: var(--focaccia-a); }
  .accent-pizza .ing-row.total .ing-amt{ color: var(--pizza-a); }
  .accent-custom .ing-row.total .ing-amt{ color: var(--custom-b); }
  .accent-cuchaule .ing-row.total .ing-amt{ color: var(--cuchaule-a); }

  /* ---------- Pills ---------- */
  .pill-row{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-top: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .pill{
    flex: 0 0 auto;
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    text-align:center;
    min-width: 84px;
  }
  .pill .p-temp{ font-size: 0.78rem; color: var(--text-dim); }
  .pill .p-time{ font-size: 0.88rem; font-weight: 700; margin-top: 2px; }

  /* ---------- Number fields ---------- */
  .field-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .field{
    background: var(--surface2);
    border-radius: 14px;
    padding: 10px 12px;
  }
  .field label{
    display:block;
    font-size: 0.75rem;
    color: var(--text-dim);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .field .field-input-row{ display:flex; align-items:baseline; gap:4px; }
  .field input[type=number]{
    background:none;
    border:none;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--text);
    width: 4ch;
  }
  .field input[type=number]:focus{ outline:none; }
  .field .field-unit{ font-size: 0.8rem; color: var(--text-dim); }
  .field input[type=text]{
    background:none;
    border:none;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    width: 100%;
  }
  .field input[type=text]:focus{ outline:none; }

  /* ---------- Temp result boxes ---------- */
  .temp-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .temp-box{
    border-radius: 16px;
    padding: 14px;
    text-align:center;
  }
  .accent-copain .temp-box{ background: rgba(255,46,196,0.1); }
  .accent-focaccia .temp-box{ background: rgba(0,245,160,0.1); }
  .accent-pizza .temp-box{ background: rgba(255,61,90,0.1); }
  .accent-custom .temp-box{ background: rgba(123,47,247,0.14); }
  .accent-cuchaule .temp-box{ background: rgba(255,210,63,0.14); }
  .temp-box .t-label{ font-size: 0.75rem; color: var(--text-dim); font-weight: 700; margin-bottom: 4px; }
  .temp-box .t-value{ font-size: 1.6rem; font-weight: 700; }
  .accent-copain .t-value{ color: var(--copain-a); }
  .accent-focaccia .t-value{ color: var(--focaccia-a); }
  .accent-pizza .t-value{ color: var(--pizza-a); }
  .accent-custom .t-value{ color: var(--custom-b); }
  .accent-cuchaule .t-value{ color: var(--cuchaule-a); }
  .temp-box .t-unit{ font-size: 1rem; font-weight: 700; }

  .note{
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-top: 12px;
    line-height: 1.5;
  }
  .note strong{ color: var(--text); }

  /* ---------- Starter mini cards ---------- */
  .starter-flow{ display:flex; flex-direction: column; gap: 10px; }
  .starter-step{
    background: var(--surface2);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .starter-step .step-title{
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-dim);
    margin-bottom: 8px;
    display:flex;
    justify-content: space-between;
  }
  .chip-row{ display:flex; gap: 8px; flex-wrap: wrap; }
  .chip{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 0.82rem;
  }
  .chip b{ font-variant-numeric: tabular-nums; }
  .accent-copain .chip b{ color: var(--copain-a); }
  .accent-focaccia .chip b{ color: var(--focaccia-a); }
  .accent-pizza .chip b{ color: var(--pizza-a); }
  .accent-custom .chip b{ color: var(--custom-b); }
  .accent-cuchaule .chip b{ color: var(--cuchaule-a); }

  .min-note{
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--text-dim);
    background: var(--surface2);
    border-radius: 10px;
    padding: 8px 10px;
  }

  /* ---------- Custom recipe list ---------- */
  .custom-flour-item, .custom-fixed-item{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 10px;
    background: var(--surface2);
    border-radius: 12px;
    padding: 8px 10px;
  }
  .custom-flour-item input[type=text], .custom-fixed-item input[type=text]{
    flex: 1;
    background:none;
    border:none;
    font-family:inherit;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
  }
  .custom-flour-item input[type=text]:focus, .custom-fixed-item input[type=text]:focus{ outline:none; }
  .custom-flour-item input[type=number], .custom-fixed-item input[type=number]{
    width: 60px;
    text-align:right;
    background:none;
    border:none;
    font-family:inherit;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 800;
  }
  .custom-flour-item input[type=number]:focus, .custom-fixed-item input[type=number]:focus{ outline:none; }
  .pct-sign{ color: var(--text-dim); font-size: 0.85rem; }
  .remove-btn{
    background:none;
    border:none;
    color: var(--text-dim);
    font-size: 1.1rem;
    cursor:pointer;
    padding: 2px 6px;
    line-height: 1;
  }
  .remove-btn:hover{ color: var(--pizza-a); }

  /* ---------- PDF button ---------- */
  .pdf-btn{
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #0a0518;
    cursor: pointer;
    margin-top: 4px;
    display:flex;

function attachCustomFlourEvents(key){
  const el = document.getElementById('panel-'+key);
  el.querySelectorAll('[data-role="flourname"]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const f = RECIPES[key].flours.find(x=>x.key===e.target.dataset.fkey);
      if(f) f.name = e.target.value;
      render(key);
    });
  });
  el.querySelectorAll('[data-role="flourpct"]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state[key].flours[e.target.dataset.fkey] = parseFloat(e.target.value) || 0;
      render(key);
    });
  });
  el.querySelectorAll('[data-role="removeflour"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const fkey = e.target.dataset.fkey;
      if(RECIPES[key].flours.length <= 1) return;
      RECIPES[key].flours = RECIPES[key].flours.filter(x=>x.key!==fkey);
      delete state[key].flours[fkey];
      renderCustomFlourList(key);
      render(key);
    });
  });
}

  el.querySelectorAll('[data-role="fixedpct"]').forEach(inp=>{

/* -------------------------- Berechnung -------------------------- */

function calc(key){
  const r = RECIPES[key];
  const s = state[key];
  const teigmenge = s.teigmenge;
  const wasserDef = r.fixed.find(f=>f.hasBassinage) || r.fixed.find(f=>/wasser|milch/i.test(f.name));

  const effectivePct = (f) => (wasserDef && f.key === wasserDef.key) ? s.hydration : f.pct;

  const fixedPctSum = r.fixed.reduce((acc,f)=> acc + effectivePct(f)/100, 0);
  const totalMehl = roundUp10(teigmenge / (1 + fixedPctSum));

  const flourGrams = {};
  r.flours.forEach(f=>{ flourGrams[f.key] = totalMehl * ((s.flours[f.key]||0)/100); });

  const fixedGrams = {};
  r.fixed.forEach(f=>{ fixedGrams[f.key] = totalMehl * (effectivePct(f)/100); });

  let bassinage = 0, wasserTeig = 0;
  if(wasserDef && wasserDef.hasBassinage){
    bassinage = fixedGrams[wasserDef.key] * (wasserDef.bassinagePct/100);
    wasserTeig = fixedGrams[wasserDef.key] - bassinage;
  }

  const totalTeig = Object.values(flourGrams).reduce((a,b)=>a+b,0)
                   + Object.values(fixedGrams).reduce((a,b)=>a+b,0);

  const H13 = s.gtt * 2;
  const H14 = (s.lt + s.mt) / 2;
  const H16 = H13 - H14;
  const handTemp = H16 - s.korrektur;
  const kneterTemp = H16 - 7 - s.korrektur;

  const sauerteigDef = r.fixed.find(f=>/sauerteig/i.test(f.name));
  const stBenoetigt = sauerteigDef ? fixedGrams[sauerteigDef.key] : 0;
  const stReserve = stBenoetigt * 0.20;
  const stAnsetzen = stBenoetigt + stReserve;
  const st2Starter = stAnsetzen * 0.10;
  const st2Mehl = stAnsetzen * 0.50;
  const st2Wasser = stAnsetzen * 0.40;
  const st2Total = st2Starter + st2Mehl + st2Wasser;

  const agBenoetigt = st2Starter;
  const agReserve = agBenoetigt * 0.25;
  const agAnsetzen = agBenoetigt + agReserve;
  const ag2Starter = agAnsetzen * 0.19;
  const ag2Mehl = agAnsetzen * 0.45;
  const ag2Wasser = agAnsetzen * 0.36;
  const ag2Total = ag2Starter + ag2Mehl + ag2Wasser;

  return {
    totalMehl, flourGrams, fixedGrams, bassinage, wasserTeig, totalTeig,
    handTemp, kneterTemp,
    stBenoetigt, stReserve, stAnsetzen, st2Starter, st2Mehl, st2Wasser, st2Total,
    agBenoetigt, agReserve, agAnsetzen, ag2Starter, ag2Mehl, ag2Wasser, ag2Total,
    wasserDefKey: wasserDef ? wasserDef.key : null
  };
}

/* -------------------------- Mengen in Zubereitungstext einsetzen -------------------------- */

function fillStepPlaceholders(text, key){
  const r = RECIPES[key];
  const c = calc(key);
  const findFixed = (regex) => r.fixed.find(f => regex.test(f.name));

  const salzDef = findFixed(/salz/i);
  const oelDef = findFixed(/öl|oel/i);
  const sauerteigDef = findFixed(/sauerteig/i);
  const anstellgutDef = findFixed(/anstellgut/i);
  const hefeDef = findFixed(/hefe/i);
  const zuckerDef = findFixed(/zucker|sweety/i);
  const butterDef = findFixed(/butter/i);
  const eiDef = r.fixed.find(f => /^ei$/i.test(f.name.trim()));
  const eiBestreichenDef = findFixed(/bestreichen/i);
  const bassinageDef = r.fixed.find(f => f.hasBassinage);
  const flüssigkeitDef = bassinageDef || findFixed(/wasser|milch/i);

  const values = {
    mehl: fmt(c.totalMehl) + ' g',
    wasser: flüssigkeitDef ? fmt(flüssigkeitDef.hasBassinage ? c.wasserTeig : c.fixedGrams[flüssigkeitDef.key]) + ' g' : '',
    milch: flüssigkeitDef ? fmt(flüssigkeitDef.hasBassinage ? c.wasserTeig : c.fixedGrams[flüssigkeitDef.key]) + ' g' : '',
    bassinage: bassinageDef ? fmt(c.bassinage) + ' g' : '',
    salz: salzDef ? fmt(c.fixedGrams[salzDef.key]) + ' g' : '',
    oel: oelDef ? fmt(c.fixedGrams[oelDef.key]) + ' g' : '',
    sauerteig: sauerteigDef ? fmt(c.fixedGrams[sauerteigDef.key]) + ' g' : '',
    anstellgut: anstellgutDef ? fmt(c.fixedGrams[anstellgutDef.key]) + ' g' : '',
    hefe: hefeDef ? fmt(c.fixedGrams[hefeDef.key]) + ' g' : '',
    zucker: zuckerDef ? fmt(c.fixedGrams[zuckerDef.key]) + ' g' : '',
    butter: butterDef ? fmt(c.fixedGrams[butterDef.key]) + ' g' : '',
    ei: eiDef ? fmt(c.fixedGrams[eiDef.key]) + ' g' : '',
    eibestreichen: eiBestreichenDef ? fmt(c.fixedGrams[eiBestreichenDef.key]) + ' g' : ''
  };

  return text.replace(/\{\{(\w+)\}\}/g, (match, name) => values[name] !== undefined ? values[name] : match);
}

function render(key){
  const r = RECIPES[key];
  const s = state[key];
  const c = calc(key);
  const el = document.getElementById('panel-'+key);

  const pieceCount = Math.max(1, Math.round(s.teigmenge / r.unitWeight));
  const perPiece = Math.round(s.teigmenge / pieceCount);
  const perPieceEl = el.querySelector('.per-piece-sub');
  if(perPieceEl){
    perPieceEl.textContent = `≈ ${fmt(perPiece)} g pro ${r.unitLabel} (${pieceCount}×)`;
  }

  const flourSum = r.flours.reduce((acc,f)=> acc + (s.flours[f.key]||0), 0);
  const totalEl = el.querySelector('.flour-total-val');
  if(totalEl) totalEl.textContent = flourSum + '%';
  const totalWrap = el.querySelector('.flour-total');
  if(totalWrap) totalWrap.classList.toggle('warn', flourSum !== 100);

  let rows = '';
  rows += `<div class="ing-row total"><span class="ing-name">Mehl gesamt</span><span class="ing-amt">${fmt(c.totalMehl)} g</span></div>`;
  r.flours.forEach(f=>{
    if((s.flours[f.key]||0) > 0){
      rows += `<div class="ing-row sub"><span class="ing-name">${f.name}</span><span class="ing-amt">${fmt(c.flourGrams[f.key])} g</span></div>`;
    }
  });
  const wasserDef = r.fixed.find(f=>f.hasBassinage) || r.fixed.find(f=>/wasser|milch/i.test(f.name));
  r.fixed.forEach(f=>{
    const displayPct = (wasserDef && f.key === wasserDef.key) ? Math.round(s.hydration) : f.pct;
    if(f.hasBassinage){
      rows += `<div class="ing-row"><span class="ing-name">${f.name}<span class="ing-pct">${displayPct}%</span></span><span class="ing-amt">${fmt(c.fixedGrams[f.key])} g</span></div>`;
      rows += `<div class="ing-row sub"><span class="ing-name">davon Bassinage</span><span class="ing-amt">${fmt(c.bassinage)} g</span></div>`;
    } else {
      rows += `<div class="ing-row"><span class="ing-name">${f.name}<span class="ing-pct">${displayPct}%</span></span><span class="ing-amt">${fmt(c.fixedGrams[f.key])} g</span></div>`;
    }
  });
  rows += `<div class="ing-row total"><span class="ing-name">Teig gesamt</span><span class="ing-amt">${fmt(c.totalTeig)} g</span></div>`;
  const resultBody = el.querySelector('.result-body');
  if(resultBody) resultBody.innerHTML = rows;

  const hydNum = el.querySelector('.hydration-num');
  if(hydNum) hydNum.textContent = Math.round(s.hydration);
  const hydSlider = el.querySelector('.hydration-slider');
  if(hydSlider) hydSlider.value = s.hydration;
  el.querySelectorAll('.hydration-chip').forEach(chip=>{
    chip.classList.toggle('active', parseInt(chip.dataset.hydration) === Math.round(s.hydration));
  });

  const th = el.querySelector('.temp-hand'), tk = el.querySelector('.temp-kneter');
  if(th) th.innerHTML = round1(c.handTemp) + '<span class="t-unit"> °C</span>';
  if(tk) tk.innerHTML = round1(c.kneterTemp) + '<span class="t-unit"> °C</span>';

  const setTxt = (sel, val) => { const e = el.querySelector(sel); if(e) e.textContent = val; };
  setTxt('.st-benoetigt', fmt(c.stBenoetigt) + ' g');
  setTxt('.st-reserve', '+' + fmt(c.stReserve) + ' g');
  setTxt('.st-ansetzen-big', fmt(c.stAnsetzen) + ' g');
  setTxt('.st2-starter', fmt(c.st2Starter) + ' g');
  setTxt('.st2-mehl', fmt(c.st2Mehl) + ' g');
  setTxt('.st2-wasser', fmt(c.st2Wasser) + ' g');
  setTxt('.st2-total', fmt(c.st2Total) + ' g total');

  setTxt('.ag-benoetigt', fmt(c.agBenoetigt) + ' g');
  setTxt('.ag-reserve', '+' + fmt(c.agReserve) + ' g');
  setTxt('.ag-ansetzen-big', fmt(c.agAnsetzen) + ' g');
  setTxt('.ag2-starter', fmt(c.ag2Starter) + ' g');
  setTxt('.ag2-mehl', fmt(c.ag2Mehl) + ' g');
  setTxt('.ag2-wasser', fmt(c.ag2Wasser) + ' g');
  setTxt('.ag2-total', fmt(c.ag2Total) + ' g total');

  el.querySelectorAll('.step-text[data-template]').forEach(span=>{
    span.textContent = fillStepPlaceholders(span.dataset.template, key);
  });
}

/* -------------------------- Events -------------------------- */

function attachEvents(key){
  const el = document.getElementById('panel-'+key);

  el.querySelector('[data-role="teigmenge"]').addEventListener('input', e=>{
    state[key].teigmenge = Math.max(50, parseFloat(e.target.value) || 0);
    el.querySelectorAll('.portion-row:not(.hydration-presets) .portion-chip').forEach(c=>c.classList.remove('active'));
    render(key);
  });

  el.querySelectorAll('.portion-row:not(.hydration-presets) .portion-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const n = parseInt(chip.dataset.n);
      const r = RECIPES[key];
      const grams = roundUp10(n * r.unitWeight);
      state[key].teigmenge = grams;
      el.querySelector('[data-role="teigmenge"]').value = grams;
      el.querySelectorAll('.portion-row:not(.hydration-presets) .portion-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      render(key);
    });
  });

  const hydSlider = el.querySelector('.hydration-slider');
  if(hydSlider){
    hydSlider.addEventListener('input', e=>{
      state[key].hydration = parseFloat(e.target.value) || 0;
      render(key);
    });
  }

  el.querySelectorAll('.hydration-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      state[key].hydration = parseFloat(chip.dataset.hydration);
      render(key);
    });
  });

  el.querySelectorAll('.flour-row input[type=range]').forEach(input=>{
    input.addEventListener('input', e=>{
      const fkey = e.target.dataset.flour;
      state[key].flours[fkey] = parseFloat(e.target.value);
      e.target.closest('.flour-row').querySelector('.pct-val').textContent = e.target.value;
      render(key);
    });
  });

  ['gtt','lt','mt','korrektur'].forEach(role=>{
    const input = el.querySelector(`[data-role="${role}"]`);
    input.addEventListener('input', e=>{
      state[key][role] = parseFloat(e.target.value) || 0;
      render(key);
    });
  });

  const pdfBtn = el.querySelector('.pdf-btn');
  pdfBtn.addEventListener('click', ()=> generatePdf(key, pdfBtn));
}

function attachNameEvent(key){
  const el = document.getElementById('panel-'+key);
  const nameInput = el.querySelector('[data-role="name"]');
  if(nameInput){
    nameInput.addEventListener('input', e=>{ state[key].name = e.target.value || RECIPES[key].label; });
  }
}

/* -------------------------- Tabs -------------------------- */

function initTabs(){
  document.querySelectorAll('.tab-icon').forEach(span=>{
    span.innerHTML = icon(span.dataset.icon);
  });
  const buttons = document.querySelectorAll('nav.tabs button');
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      buttons.forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });
}

/* -------------------------- PDF Export -------------------------- */

let jsPdfLoadPromise = null;
function loadJsPdf(){
  if(window.jspdf) return Promise.resolve();
  if(jsPdfLoadPromise) return jsPdfLoadPromise;
  jsPdfLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('jsPDF konnte nicht geladen werden'));
    document.head.appendChild(script);
  });
  return jsPdfLoadPromise;
}

async function generatePdf(key, btn){
  const originalText = btn.innerHTML;
  btn.innerHTML = '<span class="inline-icon">' + icon('hourglass') + '</span>Erstelle PDF …';
  btn.disabled = true;

  try {
    await loadJsPdf();
  } catch(err){
    console.error(err);
    btn.innerHTML = '<span class="inline-icon">' + icon('warn') + '</span>PDF nicht verfügbar';
    setTimeout(()=>{ btn.innerHTML = originalText; btn.disabled = false; }, 2200);
    return;
  }

  const r = RECIPES[key];
  const s = state[key];
  const c = calc(key);

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = 210;
    let y = 20;

    const accentMap = {
      copain:  [255, 46, 196],
      focaccia:[0, 194, 160],
      pizza:   [255, 61, 90],
      custom:  [123, 47, 247]
    };
    const [ar, ag, ab] = accentMap[key] || [123,47,247];

    // Titel
    doc.setFillColor(ar, ag, ab);
    doc.rect(0, 0, pageW, 34, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(22);
    doc.text(s.name || r.label, 15, 20);
    doc.setFontSize(11);
    doc.setFont('helvetica', 'normal');
    doc.text(fmt(c.totalTeig) + ' g Teig gesamt', 15, 28);

    y = 44;
    doc.setTextColor(30,20,40);

    function sectionTitle(txt){
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13);
      doc.setTextColor(ar, ag, ab);
      doc.text(txt, 15, y);
      y += 7;
      doc.setTextColor(30,20,40);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(11);
    }

    function row(name, val, indent){
      doc.text((indent ? '   ' : '') + name, 15 + (indent?3:0), y);
      doc.setFont('helvetica', 'bold');
      doc.text(val, pageW - 15, y, { align: 'right' });
      doc.setFont('helvetica', 'normal');
      y += 6.2;
    }

    function hr(){
      doc.setDrawColor(220,220,220);
      doc.line(15, y-2, pageW-15, y-2);
      y += 2;
    }

    // Mehl
    sectionTitle('Mehl');
    row('Total Mehl', fmt(c.totalMehl) + ' g');
    r.flours.forEach(f=>{
      if((s.flours[f.key]||0) > 0) row(f.name, fmt(c.flourGrams[f.key]) + ' g', true);
    });
    y += 3;

    // Hydration
    hr();
    sectionTitle('Hydration');
    row('Wasseranteil', Math.round(s.hydration) + '%');
    y += 2;

    // Zutaten
    hr();
    sectionTitle('Weitere Zutaten');
    const wasserDefPdf = r.fixed.find(f=>f.hasBassinage) || r.fixed.find(f=>/wasser|milch/i.test(f.name));
    r.fixed.forEach(f=>{
      const pctLabel = (wasserDefPdf && f.key === wasserDefPdf.key) ? Math.round(s.hydration) : f.pct;
      row(f.name + ' (' + pctLabel + '%)', fmt(c.fixedGrams[f.key]) + ' g');
      if(f.hasBassinage){
        row('davon Bassinage', fmt(c.bassinage) + ' g', true);
      }
    });
    y += 2;
    hr();
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    row('Teig gesamt', fmt(c.totalTeig) + ' g');
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    y += 4;

    // Gehzeit
    hr();
    sectionTitle('Gehzeit (Stockgare)');
    r.stockgare.forEach(sg=>{
      row(sg.temp, sg.dauer);
    });
    y += 2;

    // Wassertemperatur
    hr();
    sectionTitle('Wassertemperatur');
    row('Teig soll haben', s.gtt + ' °C');
    row('Luft / Mehl gerade', s.lt + ' °C / ' + s.mt + ' °C');
    if(s.korrektur > 0) row('Abzug Sommer', s.korrektur + ' °C');
    row('Von Hand kneten', round1(c.handTemp) + ' °C');
    row('Mit Maschine', round1(c.kneterTemp) + ' °C');
    y += 2;

    // Anstellgut & Sauerteig (Anstellgut zuerst ansetzen)
    if(c.stBenoetigt > 0){
      hr();
      sectionTitle('1. Anstellgut auffrischen');
      row('Insgesamt ansetzen', fmt(c.agAnsetzen) + ' g');
      row('altes Anstellgut', fmt(c.ag2Starter) + ' g', true);
      row('Mehl', fmt(c.ag2Mehl) + ' g', true);
      row('Wasser', fmt(c.ag2Wasser) + ' g', true);
      doc.setFontSize(9.5);
      doc.setTextColor(120,120,120);
      doc.text('Warmer Ort (32C Wasser), bis Menge verzweieinhalbfacht - meist 6-10 Std.', 15, y);
      doc.setTextColor(30,20,40);
      doc.setFontSize(11);
      y += 8;

      hr();
      sectionTitle('2. Sauerteig ansetzen');
      row('Insgesamt ansetzen', fmt(c.stAnsetzen) + ' g');
      row('Anstellgut', fmt(c.st2Starter) + ' g', true);
      row('Mehl', fmt(c.st2Mehl) + ' g', true);
      row('Wasser', fmt(c.st2Wasser) + ' g', true);
      doc.setFontSize(9.5);
      doc.setTextColor(120,120,120);
      doc.text('Warmer Ort (32C Wasser), bis Menge sich verdoppelt - meist 6-12 Std.', 15, y);
      doc.setTextColor(30,20,40);
      doc.setFontSize(11);
      y += 8;
    }

    // Zubereitung
    if(y > 240){ doc.addPage(); y = 20; }
    hr();
    sectionTitle('Zubereitung');
    (r.phases || []).forEach(phase => {
      if(y > 265){ doc.addPage(); y = 20; }
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10.5);
      doc.text(phase.title, 15, y);
      y += 5.5;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10.5);
      phase.steps.forEach((step, i) => {
        if(y > 278){ doc.addPage(); y = 20; }
        const filledStep = fillStepPlaceholders(step, key);
        const lines = doc.splitTextToSize((i+1) + '. ' + filledStep, pageW - 32);
        doc.text(lines, 18, y);
        y += lines.length * 5.2 + 1.5;
      });
      y += 3;
    });
    doc.setFontSize(11);
    y += 2;

    // Footer
    doc.setFontSize(9);
    doc.setTextColor(150,150,150);
    doc.text('Erstellt mit dem Sourdough Calculator', 15, 287);

    const filename = (s.name || r.label).replace(/[^a-z0-9äöüÄÖÜ]+/gi, '_').toLowerCase() + '.pdf';
    doc.save(filename);
  } catch(err){
    console.error(err);
    btn.innerHTML = '<span class="inline-icon">' + icon('warn') + '</span>Fehler beim Erstellen';
    setTimeout(()=>{ btn.innerHTML = originalText; btn.disabled = false; }, 2200);
    return;
  }

  btn.innerHTML = originalText;
  btn.disabled = false;
}

/* -------------------------- Init -------------------------- */

Object.keys(RECIPES).forEach(key=>{
  try {
    buildPanel(key);
    if(RECIPES[key].isCustom){
      buildCustomExtra(key);
    }
    attachEvents(key);
    attachNameEvent(key);
    render(key);
  } catch(err){
    console.error('Fehler beim Aufbau von', key, err);
  }
});
initTabs();

// Schriftarten erst nachträglich laden, damit ein Ladefehler die App nie blockiert
try {
  const fontLink = document.createElement('link');
  fontLink.rel = 'stylesheet';
  fontLink.href = 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600;700;800&display=swap';
  document.head.appendChild(fontLink);
} catch(e){ /* Fonts sind optional, App läuft ohne sie weiter */ }
</script>
