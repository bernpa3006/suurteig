<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f2fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0713" media="(prefers-color-scheme: dark)">
<title>Sourdough Calculator</title>
<style>
  :root{
    --bg:#0b0713; --surface:#16102a; --surface2:#1e1636; --line:#322655;
    --text:#f5f0ff; --text-dim:#a99bd4; --text-faint:#7c6fa6;
    --warn:#ff5a6e;
    --shadow: none;
    --head: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --body: 'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f2fc; --surface:#ffffff; --surface2:#f3eefb; --line:#e3daf3;
      --text:#231a3b; --text-dim:#6c6090; --text-faint:#9a8fbb;
      --warn:#d8243f;
      --shadow: 0 1px 2px rgba(40,20,80,.05), 0 10px 28px -16px rgba(40,20,80,.18);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; min-height:100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(56px, env(safe-area-inset-bottom));
    color:var(--text); font-family:var(--body); line-height:1.45;
    background:
      radial-gradient(circle at 12% 0%, rgba(255,46,196,.16), transparent 42%),
      radial-gradient(circle at 92% 12%, rgba(0,229,255,.12), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(123,47,247,.16), transparent 50%),
      var(--bg);
    background-attachment: fixed;
  }
  @media (prefers-color-scheme: light){
    body{
      background:
        radial-gradient(circle at 12% 0%, rgba(255,46,196,.10), transparent 42%),
        radial-gradient(circle at 92% 12%, rgba(0,194,255,.10), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(123,47,247,.10), transparent 50%),
        var(--bg);
      background-attachment: fixed;
    }
  }
  .app{ max-width:560px; margin:0 auto; }
  button{ font:inherit; }
  button:disabled{ cursor:default; }
  svg{ display:block; }
  input:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible{ outline:2px solid var(--a, #7b2ff7); outline-offset:2px; }

  .top h1{ margin:0 0 16px; font-family:var(--head); font-weight:700; font-size:1.8rem; letter-spacing:-.02em;
    background:linear-gradient(90deg,#ff2ec4,#7b2ff7,#00c8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .section-label{ margin:24px 4px 10px; font-size:.72rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--text-dim); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:12px; box-shadow:var(--shadow); }
  .card-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .ic{ width:34px; height:34px; flex:0 0 auto; border-radius:11px; display:grid; place-items:center; background:linear-gradient(135deg,var(--a),var(--b)); color:var(--ink); }
  .ic svg{ width:18px; height:18px; }
  .card-title{ margin:0; font-size:1rem; font-weight:700; line-height:1.25; }
  .card-sub{ margin:1px 0 0; font-size:.78rem; color:var(--text-dim); }
  .card-head .right{ margin-left:auto; }
  .big-val{ font-family:var(--head); font-size:1.9rem; font-weight:700; line-height:1; color:var(--acc); letter-spacing:-.02em; white-space:nowrap; }
  .big-val small{ font-size:1.1rem; }

  /* Sauerteig-Schnellrechner */
  .qc{ padding:14px; }
  .qc-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:.86rem; color:var(--text-dim); }
  .qc-row input{ flex:1; min-width:0; text-align:right; padding:7px 10px; border-radius:10px; background:var(--surface2); border:1px solid var(--line); color:var(--text); font-family:var(--head); font-size:16px; font-weight:700; }
  .tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .tile{ background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:8px 4px; text-align:center; }
  .tile b{ display:block; font-family:var(--head); font-size:1.05rem; }
  .tile small{ font-size:.7rem; color:var(--text-dim); }
  .fine{ margin:8px 2px 0; font-size:.72rem; color:var(--text-faint); }

  /* Rezept-Menü */
  .menu{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  @media (min-width:520px){ .menu{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .menu-btn{ display:flex; align-items:center; gap:10px; min-height:54px; padding:9px 10px; border-radius:16px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow);
    color:var(--text); font-size:.86rem; font-weight:700; text-align:left; line-height:1.15; cursor:pointer; transition:transform .12s ease, box-shadow .2s ease, background .2s ease; }
  .menu-btn:active{ transform:scale(.97); }
  .menu-btn .ic{ width:32px; height:32px; border-radius:10px; }
  .menu-btn .ic svg{ width:17px; height:17px; }
  .menu-btn.active{ background:linear-gradient(135deg,var(--a),var(--b)); color:var(--ink); border-color:transparent; box-shadow:0 12px 28px -14px var(--a); }
  .menu-btn.active .ic{ background:rgba(0,0,0,.14); color:var(--ink); }

  .panel{ display:none; margin-top:16px; scroll-margin-top:12px; }
  .panel.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  /* Schieberegler */
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:30px; margin:0; background:transparent; cursor:pointer; --track:var(--line); }
  input[type=range]::-webkit-slider-runnable-track{ height:8px; border-radius:8px; background:linear-gradient(90deg,var(--a),var(--b)) 0 0 / var(--fill,0%) 100% no-repeat, var(--track); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; margin-top:-9px; border-radius:50%; background:#fff; border:4px solid var(--a); box-shadow:0 2px 8px rgba(0,0,0,.3); }
  input[type=range]::-moz-range-track{ height:8px; border-radius:8px; background:var(--track); }
  input[type=range]::-moz-range-progress{ height:8px; border-radius:8px; background:linear-gradient(90deg,var(--a),var(--b)); }
  input[type=range]::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background:#fff; border:4px solid var(--a); }
  .scale{ display:flex; justify-content:space-between; margin-top:4px; font-family:var(--head); font-size:.8rem; font-weight:700; color:var(--text-dim); }

  /* Hero */
  .hero{ position:relative; overflow:hidden; border-radius:24px; padding:20px 18px 18px; margin-bottom:12px; background:linear-gradient(135deg,var(--a),var(--b)); color:var(--ink); box-shadow:0 20px 40px -24px var(--a); }
  .hero-bgicon{ position:absolute; right:-22px; top:-14px; width:150px; height:150px; opacity:.16; transform:rotate(-10deg); pointer-events:none; }
  .hero-bgicon svg{ width:100%; height:100%; }
  .hero-title, .hero-title-input{ position:relative; margin:0 0 16px; font-family:var(--head); font-size:1.55rem; font-weight:700; letter-spacing:-.01em; line-height:1.15; }
  .hero-title-input{ display:block; width:100%; padding:2px 0; background:none; border:0; border-bottom:2px dashed rgba(0,0,0,.25); border-radius:0; color:inherit; }
  .hero-title-input::placeholder{ color:inherit; opacity:.5; }
  .eyebrow{ position:relative; margin-bottom:10px; font-size:.7rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; opacity:.72; }
  .size-row{ position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .size-chip{ display:flex; flex-direction:column; align-items:center; gap:1px; padding:9px 4px; border:0; border-radius:14px; background:rgba(0,0,0,.14); color:inherit; cursor:pointer; }
  .size-chip b{ font-size:.92rem; } .size-chip small{ font-size:.7rem; opacity:.78; }
  .size-chip.active{ background:rgba(255,255,255,.4); box-shadow:inset 0 0 0 2px rgba(0,0,0,.14); }
  .count{ position:relative; display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .count-num{ font-family:var(--head); font-size:3rem; font-weight:700; line-height:1; letter-spacing:-.03em; }
  .count-unit{ font-size:1.05rem; font-weight:700; opacity:.85; }
  .hero input[type=range]{ position:relative; --track:rgba(0,0,0,.16); }
  .hero input[type=range]::-webkit-slider-runnable-track{ background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) 0 0 / var(--fill,0%) 100% no-repeat, var(--track); }
  .hero input[type=range]::-webkit-slider-thumb{ border:0; box-shadow:0 2px 10px rgba(0,0,0,.3), 0 0 0 5px rgba(255,255,255,.3); }
  .hero input[type=range]::-moz-range-progress{ background:rgba(255,255,255,.6); }
  .hero input[type=range]::-moz-range-thumb{ border:0; }
  .hero .scale{ color:inherit; opacity:.7; position:relative; }
  .hero-foot{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding-top:14px; border-top:1px solid rgba(0,0,0,.14); }
  .gram-field{ display:flex; align-items:baseline; gap:6px; padding:8px 12px; border-radius:14px; background:rgba(0,0,0,.12); cursor:text; }
  .gram-field input{ width:5ch; padding:0; background:none; border:0; color:inherit; font-family:var(--head); font-size:1.5rem; font-weight:700; -moz-appearance:textfield; }
  .gram-field input::-webkit-outer-spin-button, .gram-field input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .gram-field span{ font-size:.85rem; font-weight:700; opacity:.8; }
  .per-piece{ font-size:.82rem; font-weight:700; opacity:.82; text-align:right; }
  .hero-meta{ position:relative; display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:12px; font-size:.78rem; font-weight:600; opacity:.85; }
  .hero-meta a{ color:inherit; }

  .chip-row{ display:flex; gap:8px; margin-top:12px; }
  .chip-btn{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:1px; padding:8px 4px; border:1px solid var(--line); border-radius:12px; background:var(--surface2); color:var(--text-dim); font-size:.8rem; font-weight:700; cursor:pointer; }
  .chip-btn small{ font-family:var(--head); font-size:.72rem; font-weight:600; opacity:.85; }
  .chip-btn.active{ background:linear-gradient(135deg,var(--a),var(--b)); color:var(--ink); border-color:transparent; }

  /* Aufklappbare Karten */
  .fold > summary{ list-style:none; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .fold > summary::-webkit-details-marker{ display:none; }
  .fold .sum-text{ flex:1; min-width:0; }
  .chev{ width:20px; height:20px; color:var(--text-dim); transition:transform .2s ease; flex:0 0 auto; }
  .chev svg{ width:20px; height:20px; }
  .fold[open] .chev{ transform:rotate(180deg); }
  .fold-body{ margin-top:16px; }

  .flour-row{ margin-bottom:10px; }
  .flour-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:.9rem; font-weight:600; }
  .flour-top b{ font-family:var(--head); white-space:nowrap; }
  .flour-sum{ display:flex; justify-content:space-between; margin-top:8px; padding-top:10px; border-top:1px solid var(--line); font-size:.82rem; font-weight:700; color:var(--text-dim); }
  .flour-sum b{ font-family:var(--head); color:var(--text); }
  .flour-sum.warn b, .card-sub.warn{ color:var(--warn); }

  .edit-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; padding:6px 6px 6px 12px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; }
  .edit-row input[type=text]{ flex:1; min-width:0; padding:4px 0; background:none; border:0; color:var(--text); font-size:16px; font-weight:600; font-family:var(--body); }
  .edit-row input[type=number]{ width:66px; padding:5px 6px; text-align:right; background:var(--surface); border:1px solid var(--line); border-radius:8px; color:var(--text); font-family:var(--head); font-size:16px; font-weight:700; }
  .edit-row input[type=number]:disabled{ opacity:.6; }
  .edit-row .unit{ font-size:.82rem; color:var(--text-dim); }
  .icon-btn{ width:32px; height:32px; flex:0 0 auto; display:grid; place-items:center; border:0; border-radius:9px; background:none; color:var(--text-dim); cursor:pointer; }
  .icon-btn:disabled{ opacity:.3; }
  .icon-btn svg{ width:16px; height:16px; }
  .add-btn{ width:100%; margin-top:2px; padding:11px; border:1px dashed var(--line); border-radius:12px; background:none; color:var(--text-dim); font-size:.86rem; font-weight:700; cursor:pointer; }
  .field-note{ margin:4px 2px 10px; font-size:.74rem; color:var(--text-faint); }

  /* Zutatenliste */
  .ing{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  .ing-name{ font-size:.95rem; min-width:0; }
  .ing-pct{ margin-left:8px; padding:1px 6px; border-radius:6px; background:var(--surface2); font-family:var(--head); font-size:.72rem; color:var(--text-dim); white-space:nowrap; }
  .ing-note{ display:block; margin-top:2px; font-size:.74rem; font-style:italic; color:var(--text-faint); }
  .ing-amt{ font-family:var(--head); font-size:1.05rem; font-weight:700; white-space:nowrap; }
  .ing.head .ing-name{ font-weight:700; } .ing.head .ing-amt{ color:var(--acc); font-size:1.2rem; }
  .ing.sub{ padding:7px 0 7px 14px; border-bottom-style:dashed; }
  .ing.sub .ing-name{ font-size:.88rem; color:var(--text-dim); } .ing.sub .ing-amt{ font-size:.92rem; color:var(--text-dim); }
  .ing.total{ margin-top:4px; padding-top:14px; border-top:2px solid var(--line); border-bottom:0; }
  .ing.total .ing-name{ font-weight:700; } .ing.total .ing-amt{ font-size:1.5rem; color:var(--acc); }
  .sub-head{ display:flex; align-items:center; gap:6px; margin:18px 0 8px; font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-dim); }
  .sub-head svg{ width:14px; height:14px; }
  .pills{ display:flex; flex-wrap:wrap; gap:8px; }
  .pill{ padding:7px 11px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; }
  .pill small{ display:block; font-size:.7rem; color:var(--text-dim); } .pill b{ font-family:var(--head); font-size:.9rem; }

  /* Sauerteig vorbereiten */
  .step-block{ margin-top:10px; padding:14px; background:var(--surface2); border:1px solid var(--line); border-radius:16px; }
  .step-top{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .step-no{ width:26px; height:26px; flex:0 0 auto; display:grid; place-items:center; border-radius:50%; background:linear-gradient(135deg,var(--a),var(--b)); color:var(--ink); font-family:var(--head); font-size:.82rem; font-weight:700; }
  .step-name{ font-size:.92rem; font-weight:700; }
  .step-total{ margin-left:auto; font-family:var(--head); font-size:1.15rem; font-weight:700; color:var(--acc); white-space:nowrap; }
  .step-block .tile{ background:var(--surface); }
  .step-note{ margin:10px 0 0; font-size:.76rem; color:var(--text-dim); }

  /* Zubereitung */
  .phase + .phase{ margin-top:18px; }
  .phase-title{ margin-bottom:10px; font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); }
  .steps{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
  .steps li{ display:flex; gap:10px; align-items:flex-start; font-size:.9rem; }
  .steps .step-no{ width:22px; height:22px; font-size:.72rem; margin-top:1px; }

  .pdf-btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:16px; margin-top:4px; border:0; border-radius:18px; background:linear-gradient(120deg,var(--a),var(--b)); color:var(--ink); font-size:1rem; font-weight:800; cursor:pointer; box-shadow:0 14px 30px -16px var(--a); }
  .pdf-btn svg{ width:18px; height:18px; } .pdf-btn:disabled{ opacity:.7; }
  .foot{ margin-top:28px; text-align:center; font-size:.72rem; color:var(--text-faint); }
</style>
</head>
<body>
<div id="crash-banner" style="display:none;position:fixed;top:0;left:0;right:0;background:#ff2ec4;color:#1a0510;font-family:monospace;font-size:12px;padding:10px;z-index:9999;white-space:pre-wrap;"></div>
<div class="app">
  <header class="top"><h1>Sourdough Calculator</h1></header>

  <section class="card qc t-brand" aria-label="Sauerteig-Rechner">
    <label class="qc-row"><span>Ich brauche</span>
      <input type="number" id="qcInput" inputmode="numeric" min="0" step="5" value="110" aria-label="Benötigte Sauerteigmenge in Gramm">
      <span>g Sauerteig</span></label>
    <div class="tiles">
      <div class="tile"><b id="qcAnstellgut">13</b><small>Anstellgut</small></div>
      <div class="tile"><b id="qcMehl">66</b><small>Mehl</small></div>
      <div class="tile"><b id="qcWasser">53</b><small>Wasser</small></div>
    </div>
    <p class="fine">Verhältnis 2 / 10 / 8, inkl. 20 % Reserve</p>
  </section>

  <h2 class="section-label">Recipes</h2>
  <nav class="menu" id="menu" aria-label="Rezepte"></nav>
  <main id="panels"></main>

  <footer class="foot">Alle Mengen in Gramm · v8</footer>
</div>
<script>
window.onerror = function(msg, url, line, col, err){
  var banner = document.getElementById('crash-banner');
  if(banner){
    banner.style.display = 'block';
    banner.textContent = 'FEHLER: ' + msg + ' (Zeile ' + line + ':' + col + ')' + (err && err.stack ? '\n' + err.stack.split('\n').slice(0,4).join('\n') : '');
  }
};

/* ---------- Hilfsfunktionen ---------- */
function roundUp10(n){ return Math.ceil(n/10)*10; }
function fmt(n){
  if(n > 0 && n < 1) return n.toLocaleString('de-CH', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  return Math.round(n).toLocaleString('de-CH');
}
function uid(){ return 'x' + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Rundet eine Liste so, dass die Summe der gerundeten Werte exakt targetSum (gerundet) ergibt.
function roundToSum(values, targetSum){
  const target = Math.round(targetSum);
  const floors = values.map(v => Math.floor(v));
  const remainder = target - floors.reduce((a,b)=>a+b, 0);
  const withFrac = values.map((v,i) => ({ i, frac: v - floors[i] }));
  withFrac.sort((a,b) => b.frac - a.frac);
  const result = floors.slice();
  for(let k = 0; k < remainder && k < withFrac.length; k++){ result[withFrac[k].i] += 1; }
  return result;
}

/* ---------- Mehltypen: Schweizer Entsprechung ---------- */
const FLOUR_TYPE_HINTS = [
  { pattern: /tipo\s*00/i, ch: 'Weissmehl' },
  { pattern: /tipo\s*0\b/i, ch: 'Weissmehl' },
  { pattern: /tipo\s*1\b/i, ch: 'Halbweissmehl' },
  { pattern: /type\s*40[05]/i, ch: 'Weissmehl' },
  { pattern: /type\s*550/i, ch: 'Weissmehl' },
  { pattern: /type\s*(700|720|812)/i, ch: 'Halbweissmehl' },
  { pattern: /type\s*(1050|1100)/i, ch: 'Ruchmehl' }
];
function getFlourTypeHint(name){
  const m = FLOUR_TYPE_HINTS.find(h => h.pattern.test(name));
  return m ? 'In der Schweiz: ' + m.ch : null;
}

/* ---------- Farben pro Rezept ---------- */
const THEMES = {
  brand:      {a:'#ff2ec4', b:'#7b2ff7', ink:'#ffffff'},
  copain:     {a:'#ff2ec4', b:'#ff8a1e', ink:'#1a0510'},
  focaccia:   {a:'#00f5a0', b:'#00c2ff', ink:'#04231a'},
  brotkasten: {a:'#c4d94c', b:'#7a9a1f', ink:'#0f1400'},
  pizza:      {a:'#ff3d5a', b:'#ff9d00', ink:'#2b0503'},
  buns:       {a:'#e8a94c', b:'#b5651d', ink:'#2b1200'},
  cuchaule:   {a:'#ffd23f', b:'#f2a900', ink:'#2b1200'},
  fladenbrot: {a:'#ff8f6b', b:'#c2452c', ink:'#2b0d05'},
  custom:     {a:'#7b2ff7', b:'#00c8ff', ink:'#ffffff'}
};
(function injectThemes(){
  let css = '';
  Object.keys(THEMES).forEach(k => { const t = THEMES[k]; css += `.t-${k}{--a:${t.a};--b:${t.b};--ink:${t.ink};--acc:${t.a};}\n`; });
  css += '@media (prefers-color-scheme: light){\n';
  Object.keys(THEMES).forEach(k => { css += `.t-${k}{--acc:color-mix(in srgb, ${THEMES[k].b} 68%, #000);}\n`; });
  css += '}\n';
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);
})();

/* =========================================================================
   ZUSTAND
   ========================================================================= */

let activeKey = 'copain';
const state = {};
Object.keys(RECIPES).forEach(key => {
  const r = RECIPES[key];
  state[key] = {
    name: r.label,
    teigmenge: r.defaultTeigmenge,
    flours: Object.fromEntries(r.flours.map(f => [f.key, f.pct])),
    hydration: r.hydration.basic,
    size: r.sizes ? (r.sizes.find(s => s.weight === r.unitWeight) || r.sizes[Math.floor(r.sizes.length/2)]).key : null
  };
});

function getUnitWeight(key){
  const r = RECIPES[key];
  if(r.sizes){
    const found = r.sizes.find(s => s.key === state[key].size);
    return found ? found.weight : r.unitWeight;
  }
  return r.unitWeight;
}
function unitsOf(key){ return Math.max(1, Math.round(state[key].teigmenge / getUnitWeight(key))); }
function waterDefOf(r){ return r.fixed.find(f => f.hasBassinage) || r.fixed.find(f => /wasser|milch/i.test(f.name)); }
function starterDefOf(r){ return r.fixed.find(f => /sauerteig|anstellgut/i.test(f.name)); }
function hasStarter(r){ return r.hasStarterCards !== false && !!starterDefOf(r); }

/* =========================================================================
   BERECHNUNG
   Mehl = 100 %. Alle anderen Zutaten in % vom Mehl, Wasser/Milch über Hydration.
   ========================================================================= */

function calc(key){
  const r = RECIPES[key], s = state[key];
  const wasserDef = waterDefOf(r);
  const effectivePct = f => (wasserDef && f.key === wasserDef.key) ? s.hydration : f.pct;

  const fixedPctSum = r.fixed.reduce((acc,f) => acc + effectivePct(f)/100, 0);
  const totalMehl = roundUp10(s.teigmenge / (1 + fixedPctSum));

  const flourGrams = {};
  r.flours.forEach(f => { flourGrams[f.key] = totalMehl * ((s.flours[f.key]||0)/100); });
  const fixedGrams = {};
  r.fixed.forEach(f => { fixedGrams[f.key] = totalMehl * (effectivePct(f)/100); });

  let bassinage = 0;
  if(wasserDef && wasserDef.hasBassinage){ bassinage = fixedGrams[wasserDef.key] * (wasserDef.bassinagePct/100); }

  // Teig gesamt = Mehl gesamt + Zutaten (Mehlmischung wird separat auf Mehl gesamt verteilt)
  const fixedSum = Object.values(fixedGrams).reduce((a,b) => a+b, 0);
  const totalTeig = totalMehl + fixedSum;

  // Konsistent gerundet: Mehl gesamt + Zutaten ergeben exakt "Teig gesamt"
  const keys = r.fixed.map(f => f.key);
  const rounded = roundToSum([totalMehl, ...keys.map(k => fixedGrams[k])], totalTeig);
  const fixedGramsRounded = {};
  keys.forEach((k,i) => { fixedGramsRounded[k] = rounded[i+1]; });

  // Mehlsorten auf Mehl gesamt verteilen
  const activeFlours = r.flours.filter(f => (s.flours[f.key]||0) > 0);
  const flourSumPct = r.flours.reduce((acc,f) => acc + (s.flours[f.key]||0), 0);
  const flourTarget = activeFlours.reduce((acc,f) => acc + flourGrams[f.key], 0);
  const flourRounded = roundToSum(activeFlours.map(f => flourGrams[f.key]), flourTarget);

  // Sauerteig ansetzen: benötigte Menge + 20 % Reserve, Verhältnis 2/10/8
  const stDef = starterDefOf(r);
  const stNeed = stDef ? fixedGramsRounded[stDef.key] : 0;
  const stAnsetzen = stDef ? fixedGrams[stDef.key] * 1.2 : 0;
  const st = roundToSum([stAnsetzen*2/20, stAnsetzen*10/20, stAnsetzen*8/20], stAnsetzen);

  return {
    totalMehl, flourGrams, fixedGrams, fixedGramsRounded, activeFlours, flourRounded, flourSumPct,
    bassinage, bassinageRounded: Math.round(bassinage), totalTeig, wasserDef,
    stNeed, stTotal: Math.round(stAnsetzen), stStarter: st[0], stMehl: st[1], stWasser: st[2]
  };
}

// Anstellgut auffrischen: immer gleich, unabhängig vom Rezept, ohne Reserve

/* ---------- Mengen in Zubereitungstext einsetzen ---------- */
function fillStepPlaceholders(text, key, c){
  const r = RECIPES[key];
  c = c || calc(key);
  const find = re => r.fixed.find(f => re.test(f.name));
  const g = def => def ? fmt(c.fixedGramsRounded[def.key]) + ' g' : '';
  const liquid = c.wasserDef;
  const liquidTeig = liquid
    ? fmt(liquid.hasBassinage ? c.fixedGramsRounded[liquid.key] - c.bassinageRounded : c.fixedGramsRounded[liquid.key]) + ' g'
    : '';
  const values = {
    mehl: fmt(c.totalMehl) + ' g',
    wasser: liquidTeig,
    milch: liquidTeig,
    bassinage: (liquid && liquid.hasBassinage) ? fmt(c.bassinageRounded) + ' g' : '',
    salz: g(find(/salz/i)),
    oel: g(find(/öl|oel/i)),
    sauerteig: g(find(/sauerteig/i)),
    anstellgut: g(find(/anstellgut/i)),
    hefe: g(find(/hefe/i)),
    zucker: g(find(/zucker|sweety/i)),
    butter: g(find(/butter/i)),
    honig: g(find(/honig/i)),
    joghurt: g(find(/joghurt/i)),
    sesam: g(find(/sesam/i)),
    ei: g(r.fixed.find(f => /^ei$/i.test(f.name.trim()))),
    eibestreichen: g(find(/bestreichen/i))
  };
  return text.replace(/\{\{(\w+)\}\}/g, (m, name) => values[name] !== undefined ? values[name] : m);
}

function panelEl(key){ return document.getElementById('panel-' + key); }
function setFill(inp){
  const min = parseFloat(inp.min) || 0, max = parseFloat(inp.max) || 100;
  const v = Math.min(max, Math.max(min, parseFloat(inp.value) || 0));
  inp.style.setProperty('--fill', ((v - min) / (max - min || 1) * 100) + '%');
}

function buildMenu(){
  const nav = document.getElementById('menu');
  nav.innerHTML = MENU.map(m => `
    <button type="button" class="menu-btn t-${m.key}" data-key="${m.key}" aria-pressed="false">
      <span class="ic">${icon(RECIPES[m.key].icon)}</span><span>${m.label}</span>
    </button>`).join('');
  nav.addEventListener('click', e => {
    const btn = e.target.closest('.menu-btn');
    if(btn) selectRecipe(btn.dataset.key, true);
  });
}

function selectRecipe(key, fromUser){
  if(!RECIPES[key]) key = 'copain';
  activeKey = key;
  document.querySelectorAll('.menu-btn').forEach(b => {
    const on = b.dataset.key === key;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
  try { localStorage.setItem('sdc-recipe', key); } catch(e){}
  if(fromUser){
    const p = panelEl(key);
    if(p && typeof p.getBoundingClientRect === 'function' && typeof p.scrollIntoView === 'function'){
      if(p.getBoundingClientRect().top > window.innerHeight * 0.55) p.scrollIntoView({ behavior:'smooth', block:'start' });
    }
  }
}

  const el = panelEl(key), r = RECIPES[key], s = state[key], wd = waterDefOf(r);
  const fl = el.querySelector('[data-out="customflours"]');
  if(fl){
    fl.innerHTML = r.flours.map(f => `
      <div class="edit-row">
        <input type="text" value="${esc(f.name)}" data-role="flourname" data-fkey="${f.key}" aria-label="Mehlsorte">
        <input type="number" inputmode="decimal" min="0" max="100" step="5" value="${s.flours[f.key] || 0}" data-role="flourpct" data-fkey="${f.key}" aria-label="Anteil in Prozent">
        <span class="unit">%</span>
        <button type="button" class="icon-btn" data-role="removeflour" data-fkey="${f.key}" aria-label="Mehlsorte entfernen"${r.flours.length <= 1 ? ' disabled' : ''}>${icon('trash')}</button>
      </div>`).join('');
  }
  const fx = el.querySelector('[data-out="customfixed"]');
  if(fx){
    fx.innerHTML = r.fixed.map(f => {
      const isWater = wd && f.key === wd.key;
      return `
      <div class="edit-row">
        <input type="text" value="${esc(f.name)}" data-role="fixedname" data-fkey="${f.key}" aria-label="Zutat">
        <input type="number" inputmode="decimal" min="0" max="200" step="0.5" value="${isWater ? s.hydration : f.pct}" data-role="fixedpct" data-fkey="${f.key}" aria-label="Anteil in Prozent"${isWater ? ' disabled data-water="1"' : ''}>
        <span class="unit">%</span>
        <button type="button" class="icon-btn" data-role="removefixed" data-fkey="${f.key}" aria-label="Zutat entfernen">${icon('trash')}</button>
      </div>`;
    }).join('');
  }
}

/* =========================================================================
   ANZEIGE AKTUALISIEREN
   ========================================================================= */

function render(key){
  const r = RECIPES[key], s = state[key], c = calc(key);
  const el = panelEl(key);
  if(!el) return;
  const q = sel => el.querySelector(sel);
  const setTxt = (sel, v) => { const e = q(sel); if(e) e.textContent = v; };

  // Menge
  const units = unitsOf(key);
  const uSlider = q('[data-role="units"]');
  if(uSlider){ uSlider.value = Math.min(parseInt(uSlider.max, 10), units); setFill(uSlider); }
  setTxt('[data-out="units"]', units);
  setTxt('[data-out="perpiece"]', `≈ ${fmt(s.teigmenge / units)} g pro ${r.unitLabel}`);
  el.querySelectorAll('.size-chip').forEach(ch => ch.classList.toggle('active', ch.dataset.size === s.size));

  // Hydration
  const hyd = Math.round(s.hydration);
  setTxt('[data-out="hyd"]', hyd);
  const hSlider = q('[data-role="hydration"]');
  if(hSlider){ hSlider.value = s.hydration; setFill(hSlider); }
  el.querySelectorAll('[data-role="preset"]').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.v) === hyd));
  const waterInput = q('[data-water="1"]');
  if(waterInput) waterInput.value = s.hydration;

  // Mehlmischung
  const sumOk = Math.abs(c.flourSumPct - 100) < 0.001;
  const sub = q('[data-out="floursub"]');
  if(sub){
    sub.textContent = sumOk
      ? c.activeFlours.map(f => `${s.flours[f.key]} % ${f.name}`).join(', ')
      : `Summe ${fmt(c.flourSumPct)} %, bitte auf 100 % anpassen`;
    sub.classList.toggle('warn', !sumOk);
  }
  setTxt('[data-out="floursumval"]', fmt(c.flourSumPct) + ' %');
  const sumRow = q('[data-out="floursumrow"]');
  if(sumRow) sumRow.classList.toggle('warn', !sumOk);
  el.querySelectorAll('[data-out="fpct"]').forEach(sp => { sp.textContent = s.flours[sp.dataset.fkey] || 0; });
  el.querySelectorAll('[data-role="flour"]').forEach(inp => { inp.value = s.flours[inp.dataset.fkey] || 0; setFill(inp); });

  // Zutaten
  const row = (name, amt, cls, pct, note) => `
    <div class="ing${cls ? ' ' + cls : ''}">
      <span class="ing-name">${esc(name)}${pct !== undefined && pct !== null ? `<span class="ing-pct">${pct} %</span>` : ''}${note ? `<span class="ing-note">${esc(note)}</span>` : ''}</span>
      <span class="ing-amt">${amt}</span>
    </div>`;
  let html = row('Mehl gesamt', fmt(c.totalMehl) + ' g', 'head');
  if(!sumOk) html += row(`Mehlmischung ergibt ${fmt(c.flourSumPct)} % statt 100 %`, '', 'sub');
  c.activeFlours.forEach((f, i) => {
    html += row(f.name, c.flourRounded[i].toLocaleString('de-CH') + ' g', 'sub', null, getFlourTypeHint(f.name));
  });
  const stDef = starterDefOf(r);
  r.fixed.forEach(f => {
    const isLiquid = c.wasserDef && f.key === c.wasserDef.key;
    const pct = isLiquid ? hyd : f.pct;
    const grams = c.fixedGramsRounded[f.key];
    const note = (hasStarter(r) && stDef && f.key === stDef.key) ? 'Angesetzt im Verhältnis 2 / 10 / 8' : null;
    html += row(f.name, grams.toLocaleString('de-CH') + ' g', '', pct, note);
    if(f.hasBassinage){
      html += row('davon im Teig', (grams - c.bassinageRounded).toLocaleString('de-CH') + ' g', 'sub');
      html += row('davon Bassinage (später zugeben)', c.bassinageRounded.toLocaleString('de-CH') + ' g', 'sub');
    }
  });
  html += row('Teig gesamt', fmt(c.totalTeig) + ' g', 'total');
  const ings = q('[data-out="ings"]');
  if(ings) ings.innerHTML = html;
  setTxt('[data-out="ingsub"]', `Für ${units} × ${r.unitLabel}`);

  // Sauerteig ansetzen
  if(hasStarter(r)){
    setTxt('[data-out="st-total"]', fmt(c.stTotal) + ' g');
    setTxt('[data-out="st-starter"]', c.stStarter + ' g');
    setTxt('[data-out="st-mehl"]', c.stMehl + ' g');
    setTxt('[data-out="st-wasser"]', c.stWasser + ' g');
    setTxt('[data-out="st-note"]', `Für ${fmt(c.stNeed)} g im Teig plus 20 % Reserve. Warm stehen lassen, bis er sich mindestens verdoppelt hat, meist 6-12 Std.`);
  }

  // Zubereitung
  el.querySelectorAll('[data-phase]').forEach(sp => {
    const tpl = r.phases[+sp.dataset.phase].steps[+sp.dataset.step];
    sp.textContent = fillStepPlaceholders(tpl, key, c);
  });
}

/* =========================================================================
   EREIGNISSE
   ========================================================================= */

function attachEvents(key, el){
  const r = RECIPES[key], s = state[key];
  const gramInput = () => el.querySelector('[data-role="teigmenge"]');
  const setGrams = g => { s.teigmenge = g; const gi = gramInput(); if(gi) gi.value = g; };

  el.addEventListener('input', e => {
    const t = e.target, role = t.dataset.role;
    if(!role) return;
    const fkey = t.dataset.fkey;
    switch(role){
      case 'teigmenge': s.teigmenge = Math.max(50, parseFloat(t.value) || 0); break;
      case 'units': setGrams(roundUp10(parseInt(t.value, 10) * getUnitWeight(key))); break;
      case 'hydration': s.hydration = parseFloat(t.value) || r.hydration.basic; break;
      case 'flour': s.flours[fkey] = parseFloat(t.value) || 0; break;
      case 'name': s.name = t.value.trim() || r.label; return;
      case 'flourname': { const f = r.flours.find(x => x.key === fkey); if(f) f.name = t.value; break; }
      case 'flourpct': s.flours[fkey] = Math.max(0, parseFloat(t.value) || 0); break;
      case 'fixedname': { const f = r.fixed.find(x => x.key === fkey); if(f) f.name = t.value; break; }
      case 'fixedpct': { const f = r.fixed.find(x => x.key === fkey); if(f) f.pct = Math.max(0, parseFloat(t.value) || 0); break; }
      default: return;
    }
    render(key);
  });

  el.addEventListener('change', e => {
    const role = e.target.dataset.role;
    if(role === 'fixedname'){ renderCustomLists(key); render(key); }
    if(role === 'teigmenge'){ e.target.value = s.teigmenge; }
  });

  el.addEventListener('click', e => {
    const b = e.target.closest('[data-role]');
    if(!b || b.tagName === 'INPUT') return;
    const role = b.dataset.role, fkey = b.dataset.fkey;
    switch(role){
      case 'size': {
        const units = unitsOf(key);
        s.size = b.dataset.size;
        setGrams(roundUp10(units * getUnitWeight(key)));
        break;
      }
      case 'preset': s.hydration = parseFloat(b.dataset.v); break;
      case 'pdf': generatePdf(key, b); return;
      case 'addflour': { const k = uid(); r.flours.push({ key:k, name:'Neues Mehl', pct:0 }); s.flours[k] = 0; renderCustomLists(key); break; }
      case 'removeflour':
        if(r.flours.length <= 1) return;
        r.flours = r.flours.filter(x => x.key !== fkey); delete s.flours[fkey]; renderCustomLists(key); break;
      case 'addfixed': r.fixed.push({ key:uid(), name:'Neue Zutat', pct:0 }); renderCustomLists(key); break;
      case 'removefixed': r.fixed = r.fixed.filter(x => x.key !== fkey); renderCustomLists(key); break;
      default: return;
    }
    render(key);
  });
}

/* =========================================================================
   SAUERTEIG-SCHNELLRECHNER (oben)
   ========================================================================= */

function initQuickCalc(){
  const input = document.getElementById('qcInput');
  if(!input) return;
  const update = () => {
    const need = Math.max(0, parseFloat(input.value) || 0);
    const total = need * 1.2;
    const v = roundToSum([total*2/20, total*10/20, total*8/20], total);
    document.getElementById('qcAnstellgut').textContent = v[0].toLocaleString('de-CH');
    document.getElementById('qcMehl').textContent = v[1].toLocaleString('de-CH');
    document.getElementById('qcWasser').textContent = v[2].toLocaleString('de-CH');
  };
  input.addEventListener('input', update);
  update();
}

/* =========================================================================
   PDF
   ========================================================================= */

let jsPdfLoadPromise = null;
function loadJsPdf(){
  if(window.jspdf) return Promise.resolve();
  if(jsPdfLoadPromise) return jsPdfLoadPromise;
  jsPdfLoadPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload = () => resolve();
    sc.onerror = () => { jsPdfLoadPromise = null; reject(new Error('jsPDF konnte nicht geladen werden')); };
    document.head.appendChild(sc);
  });
  return jsPdfLoadPromise;
}

function pdfText(t){ return String(t).replace(/≈/g, 'ca.').replace(/→/g, '->').replace(/↗/g, '').replace(/[–—]/g, '-'); }

async function generatePdf(key, btn){
  const original = btn.innerHTML;
  const restore = (msg) => {
    if(msg){ btn.innerHTML = icon('warn') + '<span>' + msg + '</span>'; setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 2200); }
    else { btn.innerHTML = original; btn.disabled = false; }
  };
  btn.disabled = true;
  btn.innerHTML = icon('hourglass') + '<span>PDF wird erstellt …</span>';
  try { await loadJsPdf(); } catch(err){ console.error(err); restore('PDF nicht verfügbar'); return; }

  try {
    const r = RECIPES[key], s = state[key], c = calc(key);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:'a4' });
    const W = 210, L = 16, R = W - 16;
    const th = THEMES[key] || THEMES.brand;
    const A = hexToRgb(th.a), INK = hexToRgb(th.ink);
    const ACC = hexToRgb(th.b).map(v => Math.round(v * 0.68));
    const TEXT = [35,26,59], DIM = [110,100,140];
    const units = unitsOf(key);
    let y;

    // Kopf
    doc.setFillColor(A[0], A[1], A[2]);
    doc.rect(0, 0, W, 32, 'F');
    doc.setTextColor(INK[0], INK[1], INK[2]);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(21);
    doc.text(pdfText(s.name || r.label), L, 17);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
    doc.text(pdfText(`${units} x ${r.unitLabel}  |  ${fmt(c.totalTeig)} g Teig  |  Hydration ${Math.round(s.hydration)} %`), L, 25);
    y = 44;

    const ensure = h => { if(y + h > 280){ doc.addPage(); y = 20; } };
    const section = title => {
      ensure(16);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5);
      doc.setTextColor(ACC[0], ACC[1], ACC[2]);
      doc.text(pdfText(title), L, y);
      doc.setDrawColor(A[0], A[1], A[2]); doc.setLineWidth(0.5);
      doc.line(L, y + 2, R, y + 2);
      y += 8.5;
      doc.setTextColor(TEXT[0], TEXT[1], TEXT[2]);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
    };
    const row = (name, val, o) => {
      o = o || {};
      ensure(7);
      const x = L + (o.indent ? 5 : 0);
      doc.setFontSize(o.big ? 12.5 : (o.indent ? 10 : 10.5));
      doc.setFont('helvetica', o.bold ? 'bold' : 'normal');
      doc.setTextColor(...(o.indent ? DIM : TEXT));
      doc.text(pdfText(name), x, y);
      doc.setFont('helvetica', 'bold');
      if(val) doc.text(pdfText(val), R, y, { align:'right' });
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(TEXT[0], TEXT[1], TEXT[2]);
      y += o.big ? 7.5 : 6;
    };
    const note = (txt, indent) => {
      doc.setFontSize(8.8); doc.setFont('helvetica', 'italic'); doc.setTextColor(DIM[0], DIM[1], DIM[2]);
      const lines = doc.splitTextToSize(pdfText(txt), R - L - (indent ? 5 : 0));
      ensure(lines.length * 4 + 2);
      doc.text(lines, L + (indent ? 5 : 0), y - 1.5);
      y += lines.length * 4 + 0.5;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(TEXT[0], TEXT[1], TEXT[2]);
    };

    // Zutaten
    section('Zutaten');
    row('Mehl gesamt', fmt(c.totalMehl) + ' g', { bold:true });
    c.activeFlours.forEach((f, i) => {
      row(f.name, c.flourRounded[i] + ' g', { indent:true });
      const hint = getFlourTypeHint(f.name);
      if(hint) note(hint, true);
    });
    const stDef = starterDefOf(r);
    r.fixed.forEach(f => {
      const isLiquid = c.wasserDef && f.key === c.wasserDef.key;
      const pct = isLiquid ? Math.round(s.hydration) : f.pct;
      const grams = c.fixedGramsRounded[f.key];
      row(`${f.name} (${pct} %)`, grams + ' g');
      if(f.hasBassinage){
        row('davon im Teig', (grams - c.bassinageRounded) + ' g', { indent:true });
        row('davon Bassinage (später zugeben)', c.bassinageRounded + ' g', { indent:true });
      }
      if(hasStarter(r) && stDef && f.key === stDef.key) note('Angesetzt im Verhältnis 2 / 10 / 8', true);
    });
    ensure(10);
    doc.setDrawColor(210, 200, 230); doc.setLineWidth(0.3);
    doc.line(L, y - 3, R, y - 3);
    y += 1.5;
    row('Teig gesamt', fmt(c.totalTeig) + ' g', { bold:true, big:true });
    y += 4;

    // Gehzeit
    section('Gehzeit (Richtwerte)');
    r.stockgare.forEach(sg => row(sg.temp, sg.dauer));
    note('Massgebend ist, wie stark der Teig aufgeht, nicht die Uhr.');
    y += 4;

    // Sauerteig
    if(hasStarter(r)){
      section('Sauerteig vorbereiten');
      row('1. Anstellgut auffrischen', REFRESH.total + ' g', { bold:true });
      row('Anstellgut', REFRESH.starter + ' g', { indent:true });
      row('Mehl', REFRESH.mehl + ' g', { indent:true });
      row('Wasser', REFRESH.wasser + ' g', { indent:true });
      note('Immer gleich, unabhängig vom Rezept. Warm stehen lassen, bis sich die Menge gut verzweieinhalbfacht hat, meist 6-10 Std.');
      y += 2;
      row('2. Sauerteig ansetzen', fmt(c.stTotal) + ' g', { bold:true });
      row('Anstellgut', c.stStarter + ' g', { indent:true });
      row('Mehl', c.stMehl + ' g', { indent:true });
      row('Wasser', c.stWasser + ' g', { indent:true });
      note(`Für ${fmt(c.stNeed)} g im Teig plus 20 % Reserve, Verhältnis 2 / 10 / 8. Warm stehen lassen, bis er sich mindestens verdoppelt hat, meist 6-12 Std.`);
      y += 4;
    }

    // Zubereitung
    section('Zubereitung');
    r.phases.forEach(ph => {
      ensure(14);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
      doc.setTextColor(ACC[0], ACC[1], ACC[2]);
      doc.text(pdfText(ph.title), L, y);
      y += 5.5;
      doc.setFont('helvetica', 'normal'); doc.setTextColor(TEXT[0], TEXT[1], TEXT[2]);
      ph.steps.forEach((st, i) => {
        const lines = doc.splitTextToSize(pdfText(fillStepPlaceholders(st, key, c)), R - L - 7);
        ensure(lines.length * 5 + 1.5);
        doc.setFont('helvetica', 'bold'); doc.text((i+1) + '.', L, y);
        doc.setFont('helvetica', 'normal'); doc.text(lines, L + 7, y);
        y += lines.length * 5 + 1.5;
      });
      y += 3;
    });

    // Seitenfuss
    const pages = doc.getNumberOfPages();
    for(let p = 1; p <= pages; p++){
      doc.setPage(p);
      doc.setFontSize(8.5); doc.setFont('helvetica', 'normal'); doc.setTextColor(150, 140, 175);
      doc.text('Erstellt mit dem Sourdough Calculator', L, 290);
      doc.text(`Seite ${p} / ${pages}`, R, 290, { align:'right' });
    }

    const filename = (s.name || r.label).replace(/[^a-z0-9äöüÄÖÜ]+/gi, '_').replace(/^_+|_+$/g, '').toLowerCase() + '.pdf';
    doc.save(filename || 'rezept.pdf');
    restore();
  } catch(err){
    console.error(err);
    restore('Fehler beim Erstellen');
  }
}
